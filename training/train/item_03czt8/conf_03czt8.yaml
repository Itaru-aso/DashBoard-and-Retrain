# 03CZT8専用config。既存の `training/conf/config.yaml` をベースに、
# 03CZT8向けの値のみを変更したコピー（既存config.yamlは一切変更しない、
# `.kiro/specs/retraining/new-item-03czt8-model-creation.md` v3.0 決定3・6）。
#
# 変更点:
#   - common.target_item/target_color: 03CZT8(color_no=053, 05CZT8と共有)
#   - common.dataset_path/model_dir/backup_dir/pool_base/splits_dir:
#     03CZT8専用パスに分離（決定4、05CZT8/053の本番アーティファクトとの
#     上書き・混在を防ぐ。実測確認済みのリスク、技術的前提14参照）
#   - common.dataset_id_monochro/dataset_id_color/dataset_id_monochro_margin:
#     03CZT8向けのexport_root/export_root_marginデータセット名
#   - monochro.image_size_height/width, color.image_size_height/width:
#     アスペクト比を考慮した03CZT8向けサイズ（決定2）
#
# crop_x0/crop_width/overlapは本ファイルには置かない（決定5。
# items/item_03czt8/train_monochro.py 内の定数として保持）。

defaults:
  - override hydra/sweeper: optuna
hydra:
  sweeper:
    direction: maximize
    study_name: null
    storage: null
    n_trials: 20
    n_jobs: 2

# 共通設定
common:
  target_item:
    size: '03'
    chain: 'CZT8'
  target_color: '053'
  pretraining_dir: ./0_pretraining   # 学習入力 (Teacher 重み)。03CZT8向けサイズの
                                      # Teacher重み(512x356 monochro / 384x384 color)は
                                      # 別途用意が必要（未解決事項参照）。
  # 03CZT8専用の出力パス分離(決定4)。05CZT8等の既存色番と物理的に分離する。
  dataset_path: ./4_dataset_03czt8
  model_dir: ./6_model_03czt8
  backup_dir: ./backup_03czt8
  pool_base: ./3_pool_03czt8
  splits_dir: ./5_splits_03czt8
  # dataset選定元 (export_root直接変換)。読み取り専用データソースは既存パスを共有する
  # (dataset_idで03CZT8-*を指定するため05CZT8等のデータとは自然に分離される)。
  export_root: '\\digi2\止水F色物画像検査\画像データ\export_root'
  dataset_id_monochro: '03CZT8-monochro'
  dataset_id_color: '03CZT8-color'
  margin_export_root: '\\digi2\止水F色物画像検査\画像データ\export_root_margin'
  dataset_id_monochro_margin: '03CZT8-monochro'
  batch_size: 4
  persistent_workers: true
  gpu_id: 0
  seed: 42
  out_channels: 384
  imagenet_train_path: D:/0032011/ILSVRC/Data/CLS-LOC/train
  ftp_hosts: []
  pipeline_mode: train
  parallel_train: true
  mode: 'color'
  skip_download: false
  # 03CZT8は03/CZT8タプルがUI/backend未登録のため、pipline.py直接起動が前提
  # (決定11)。配信は本ADRのスコープ外なので既定でスキップする。
  skip_upload: true

# モノクロ専用
monochro:
  # 03CZT8向けリサイズ(決定2): アスペクト比温存(クロップ後660:950≈0.695)。
  image_size_height: 356
  image_size_width: 512
  model_size: small
  backbone: wide_resnet101
  teacher_weights: null

  use_raw_shift_dataset: true
  crop_shift_max_px: 20

  num_workers: 8

  epochs: 50
  train_step: 50000
  max_train_step: 30000
  val_interval: 2000
  early_stop_patience: 4
  early_stop_min_delta: 0.005
  hard_mining_quantile: 0.999
  pdn_dropout: 0.0
  st_loss_type: focal
  focal_gamma: 2.0
  penalty_weight: 1.0

  loss_st: 5.0
  loss_ae: 1.0
  loss_stae: 1.0

  map_st: 1.0
  map_ae: 0.0

  channel_weights:
    enabled: true
    supervised_power: 10
    unsupervised_power: 7
    blend_n_mid: 30
    blend_scale: 10.0
    max_fpr: 0.05
  edge_mask_w: 2

  cutoff: 0.33
  recall_threshold: 0.8

  pool_train_ratio: 0.7
  defect_staging:
    enabled: true
    clear_before_download: false
    auto_split_halves: true

  evaluate:
    num_thresholds: 200
    miss_rate_constraint: null

  model:
    lr: 0.0003
    weight_decay: 1.0e-05
    gamma: 0.1

  st_augmentation:
    enabled: true
    horizontal_flip: true
    color_jitter_brightness: 0.1
    color_jitter_contrast: 0.1
    color_jitter_saturation: 0.0
    sharpen_p: 0.7
    sharpen_factor_min: 1.0
    sharpen_factor_max: 4.0
    gaussian_blur_p: 0.0
    gaussian_blur_sigma_max: 0.6
  penalty_augmentation:
    grayscale_p: 1.0
    horizontal_flip: true
    color_jitter_brightness: 0.2
    color_jitter_contrast: 0.2
    color_jitter_saturation: 0.0
    random_erasing_p: 0.1
  augmentation:
    monochro:
      ae_color_jitter_brightness: 0.2
      ae_color_jitter_contrast: 0.2
      ae_color_jitter_saturation: 0.0
      ae_gaussian_blur_kernel: 3
      ae_gaussian_blur_sigma_min: 0.1
      ae_gaussian_blur_sigma_max: 1.0
      ae_gaussian_noise_std: 0.02
      ae_random_affine_degrees: 2
      ae_random_affine_translate: [0.03, 0.03]

  mlflow:
    enabled: false
    tracking_uri: ./mlruns
    experiment_name_template: "efficientad_monochro_{color}_03czt8"
    run_name_template: "pipeline_{timestamp}_{variant}"
    run_name: null
    variant: null
    targets:
      fpr: 0.03
      fnr: 0.05
    log:
      train_step_interval: 500
      onnx_model: false
      fp_fn_samples: true
      fp_fn_samples_max: 10
      fp_fn_samples_annotate: true
      heatmaps: false
      score_distribution: true
      roc_curve: true
      confusion_matrix: true
    extra_tags:
      project: "zipper_ad"
      model_family: "efficientad"

# カラー専用
color:
  # 03CZT8向けリサイズ(決定2): 正方形に近い(クロップ後1266:1280≈0.99)。
  image_size_height: 384
  image_size_width: 384
  model_size: small
  backbone: wide_resnet101
  teacher_weights: null
  num_workers: 4
  epochs: 50
  train_step: 50000
  max_train_step: 45000
  val_interval: 2000
  early_stop_patience: 4
  early_stop_min_delta: 0.005
  hard_mining_quantile: 0.999
  pdn_dropout: 0.0
  st_loss_type: focal
  focal_gamma: 2.0
  penalty_weight: 1.0
  loss_st: 5.0
  loss_ae: 1.0
  loss_stae: 1.0
  map_st: 1.0
  map_ae: 0.0
  channel_weights:
    enabled: true
    supervised_power: 10
    unsupervised_power: 7
    blend_n_mid: 30
    blend_scale: 10.0
    max_fpr: 0.05
  edge_mask_w: 2
  candidate1:
    enabled: false
    fpr_raw: 0.5
    fpr_z: 0.05
    sigma_smooth: 7
    sigma_floor_pct: 50
  cutoff: 0.33
  recall_threshold: 0.8
  pool_train_ratio: 0.7
  defect_staging:
    enabled: true
    clear_before_download: false
    auto_split_halves: true
  evaluate:
    num_thresholds: 200
    miss_rate_constraint: null
  model:
    lr: 0.0003
    weight_decay: 1.0e-05
    gamma: 0.1
  st_augmentation:
    enabled: true
    horizontal_flip: true
    color_jitter_brightness: 0.1
    color_jitter_contrast: 0.1
    color_jitter_saturation: 0.1
  penalty_augmentation:
    grayscale_p: 0.3
    horizontal_flip: true
    color_jitter_brightness: 0.2
    color_jitter_contrast: 0.2
    color_jitter_saturation: 0.2
    random_erasing_p: 0.1
  augmentation:
    color:
      ae_color_jitter_brightness: 0.2
      ae_color_jitter_contrast: 0.2
      ae_color_jitter_saturation: 0.2
      ae_gaussian_blur_kernel: 3
      ae_gaussian_blur_sigma_min: 0.1
      ae_gaussian_blur_sigma_max: 1.0
      ae_gaussian_noise_std: 0.02
      ae_random_affine_degrees: 2
      ae_random_affine_translate: [0.03, 0.03]
  mlflow:
    enabled: false
    tracking_uri: ./mlruns
    experiment_name_template: "efficientad_color_{color}_03czt8"
    run_name_template: "pipeline_{timestamp}_{variant}"
    run_name: null
    variant: null
    targets:
      fpr: 0.03
      fnr: 0.05
    log:
      train_step_interval: 500
      onnx_model: false
      fp_fn_samples: true
      fp_fn_samples_max: 10
      fp_fn_samples_annotate: true
      heatmaps: false
      score_distribution: true
      roc_curve: true
      confusion_matrix: true
    extra_tags:
      project: "zipper_ad"
      model_family: "efficientad"
